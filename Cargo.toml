[package]
name = "ccxt_demo"
version = "0.1.0"
edition = "2021"
description = "ccxt Rust demo binary built on GitHub Actions for multiple platforms"
license = "MIT"

[dependencies]
ccxt = { version = "4.5", default-features = false, features = [
    "binance",
    "okx",
    "kraken",
    "bitget",
    "bybit",
    "coinbase",
    "xt",
    "htx",
    "gate",
    "bitfinex",
    "kucoin",
    "hyperliquid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
strip = "symbols"
